name: Logo quality

on:
  pull_request:
    paths:
      - "lib/logos-data.ts"
      - "lib/logo-quality/**"
      - "lib/entity-logo.ts"
      - "public/logos/**"
      - "scripts/check-logos.mts"
      - "scripts/check-logos.test.mts"
      - "data/logo-overrides.json"
      - "data/logo-sources-*.json"
  push:
    branches:
      - main
    paths:
      - "lib/logos-data.ts"
      - "lib/logo-quality/**"
      - "lib/entity-logo.ts"
      - "public/logos/**"
      - "scripts/check-logos.mts"
      - "data/logo-overrides.json"
      - "data/logo-sources-*.json"
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  check-logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:logos
      - name: Fetch PR base for scoped logo check
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}"
      - name: Check logos (PR scope)
        if: github.event_name == 'pull_request'
        env:
          LOGO_CHECK_SCOPE: pr
          LOGO_CHECK_BASE_REF: origin/${{ github.base_ref }}
        run: pnpm check:logos
      - name: Check logos (full catalog)
        if: github.event_name != 'pull_request'
        run: pnpm check:logos
      - name: Upload logo check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logo-check-report
          path: data/logo-check-report.json
          if-no-files-found: ignore
