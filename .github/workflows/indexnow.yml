name: IndexNow (post-deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ping-changed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (sitemap for IndexNow)
        run: pnpm build

      - name: Restore previous sitemap
        uses: actions/cache/restore@v4
        with:
          path: .cache/indexnow-previous-sitemap.xml
          key: indexnow-sitemap-${{ github.repository }}
          restore-keys: |
            indexnow-sitemap-${{ github.repository }}

      - name: Ping IndexNow for changed URLs
        env:
          INDEXNOW_FETCH_CURRENT: "1"
          INDEXNOW_PREVIOUS_SITEMAP_PATH: .cache/indexnow-previous-sitemap.xml
        run: pnpm indexnow:ping-changed

      - name: Save sitemap baseline
        uses: actions/cache/save@v4
        if: success()
        with:
          path: .cache/indexnow-previous-sitemap.xml
          key: indexnow-sitemap-${{ github.repository }}
